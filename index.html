<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b383a">
<title>NO.6 GF 투과 비교계</title>
<style>
:root{color-scheme:light;--bg:#f4f7f7;--paper:#fff;--ink:#163337;--sub:#687f84;--line:#dfebeb;--accent:#08796d;--accent2:#eaf7f3;--warn:#9e601b;--warnbg:#fff6e6;--err:#9e4242;--errbg:#fff0ed;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}h1,h2,p{margin:0}main{width:min(100%,680px);margin:auto;padding:15px 13px 40px;display:grid;gap:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px}.topbar h1{font-size:20px;letter-spacing:-.5px}.badge{border-radius:99px;background:#e7efef;color:#527075;font-size:11px;font-weight:750;padding:7px 11px;white-space:nowrap}.badge.good{background:#e5f6ec;color:#08745d}.badge.warn{background:var(--warnbg);color:var(--warn)}
.card{background:var(--paper);border-radius:15px;border:1px solid var(--line);padding:13px;box-shadow:0 3px 12px #1d515009}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.head h2{font-size:14px;font-weight:800}.small{font-size:11px;color:var(--sub)}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #d0dddd;background:white;color:#315c60;border-radius:11px;padding:11px 12px;font-size:13px;font-weight:800;min-height:43px}.primary{background:var(--accent);border-color:var(--accent);color:white}.buttons button{flex:1}.mini{min-height:35px;font-size:11px;padding:7px 10px}.light{background:var(--accent2);border-color:#d4ebe3;color:#087166}.danger{color:var(--err)}
.preview{height:clamp(148px,42vw,244px);position:relative;overflow:hidden;background:#102e32;border-radius:12px;display:flex;align-items:center;justify-content:center}.preview video{width:100%;height:100%;display:block;object-fit:contain;transform:scaleX(-1)}.placeholder{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:#cfe5e4;background:#17383f;font-size:12px;font-weight:600}.preview.live .placeholder{display:none}.aim{pointer-events:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border:2px solid #b1ffe6;border-radius:50%;box-shadow:0 0 0 5px #a7fff32a}.aim:before,.aim:after{content:"";position:absolute;background:#aafde8;left:50%;top:50%;transform:translate(-50%,-50%)}.aim:before{width:14px;height:1px}.aim:after{height:14px;width:1px}.preview:not(.live) .aim{display:none}.cameraButtons{margin-top:10px}.cameraButtons #stop{flex:0 0 auto}.cameraButtons #retry{flex:0 0 auto}
.indicators{display:flex;align-items:center;gap:7px;margin-top:10px;flex-wrap:wrap}.indicator{font-size:11px;color:#688084;background:#f1f6f6;border:1px solid #e5eeee;border-radius:7px;padding:6px 9px;font-weight:700}.indicator.good{color:#137a68;background:#eaf8f1}.indicator.warn{color:var(--warn);background:var(--warnbg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{border:1px solid #e0eaea;background:#f6f9f9;border-radius:12px;padding:12px}.metric.accent{border-color:#b5e4d4;background:#eaf8f2}.metric span{display:block;color:#647e83;font-size:11px;font-weight:700}.metric strong{display:block;font-size:clamp(27px,8vw,37px);line-height:1.23;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}.metric.accent strong{color:#057760}.bar{margin-top:11px;background:#e8f0ef;border-radius:9px;overflow:hidden;height:7px}.bar>div{width:0;height:100%;background:#0a9079;transition:width .17s ease}
.label{display:block;font-size:11px;font-weight:750;color:#617e82;margin-bottom:6px}input[type=text]{width:100%;height:43px;border:1px solid #d7e4e3;border-radius:10px;padding:10px 12px;color:var(--ink);font-size:13px;outline:none}input[type=text]:focus{border-color:#65b3a1;box-shadow:0 0 0 2px #a3e4d641}.full{width:100%}.split{display:grid;grid-template-columns:1fr auto;gap:8px}.fields{margin:11px 0 10px}.message{font-size:12px;line-height:1.45;padding:10px 11px;color:#3f706c;background:#eff8f5;border-radius:9px;margin-top:10px;min-height:38px}.message.warn{color:var(--warn);background:var(--warnbg)}.message.bad{color:var(--err);background:var(--errbg)}
.recordActions{display:flex;gap:8px}.records{display:grid;gap:0}.rec{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid #edf1f1;font-size:12px}.rec:first-child{border-top:0}.rec .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:750}.rec .detail{display:block;font-size:10px;color:#789095;margin-top:4px;font-weight:500}.rec .ratio{font-size:11px;color:#697f83;font-variant-numeric:tabular-nums}.rec .drop{font-weight:850;color:#137963;font-variant-numeric:tabular-nums;min-width:65px;text-align:right}.empty{font-size:12px;color:#8aa0a3;text-align:center;padding:17px 0}footer{text-align:center;font-size:10px;color:#809499;padding-top:2px}
@media(max-width:380px){main{padding:10px 8px 26px;gap:9px}.card{padding:11px}.topbar h1{font-size:18px}.cameraButtons{gap:5px}.cameraButtons button{font-size:11px;padding:8px}.metric{padding:11px}.metric strong{font-size:28px}.preview{height:160px}}
</style>
</head>
<body>
<main>
 <header class="topbar"><h1>NO.6 · GF 투과 비교</h1><span id="cameraBadge" class="badge">카메라 OFF</span></header>
 <section class="card">
  <div class="preview" id="preview"><video id="video" autoplay muted playsinline></video><div class="placeholder">전면 카메라</div><div class="aim" aria-hidden="true"></div></div>
  <div class="buttons cameraButtons"><button id="start" class="primary">카메라 켜기</button><button id="retry" class="mini" hidden disabled>노출 재고정</button><button id="stop" class="mini" hidden disabled>카메라 끄기</button></div>
  <div class="indicators"><span class="indicator" id="exposureState">노출 확인 전</span><span class="indicator" id="stabilityState">안정도 —</span></div>
 </section>
 <section class="card">
  <div class="grid">
   <div class="metric"><span>현재 신호</span><strong id="live">—</strong></div>
   <div class="metric"><span>기준 샘플</span><strong id="base">—</strong></div>
   <div class="metric"><span>기준 대비 비율</span><strong id="ratio">—</strong></div>
   <div class="metric accent"><span>감소율</span><strong id="decrease">—</strong></div>
  </div>
  <div class="bar"><div id="ratioBar"></div></div>
  <div id="message" class="message" role="status" aria-live="polite">카메라를 켜주세요.</div>
 </section>
 <section class="card">
  <div class="head"><h2>기준 샘플</h2><span id="sampleBadge" class="small">미등록</span></div>
  <div class="split"><button id="register" class="primary" disabled>기준 샘플 등록</button><button id="reset" class="mini" disabled>초기화</button></div>
 </section>
 <section class="card">
  <div class="head"><h2>테스트품</h2><span id="testStatus" class="small">기준 등록 필요</span></div>
  <label class="label" for="testId">제품 번호 (선택)</label><input type="text" id="testId" placeholder="예: NO6-001" autocomplete="off" maxlength="60">
  <div class="fields"><button id="save" class="primary full" disabled>현재 측정값 저장</button></div>
 </section>
 <section class="card">
  <div class="head"><h2>측정 기록 <span id="count" class="small">0건</span></h2><div class="recordActions"><button id="csv" class="mini light">CSV 저장</button><button id="erase" class="mini danger">삭제</button></div></div>
  <div class="records" id="records"></div>
 </section>
 <footer>상대 영상 신호 · Lux / 실제 식각량 아님</footer>
</main>
<canvas id="frame" width="320" height="240" hidden></canvas>
<script>
(() => { 'use strict';
 const $ = id => document.getElementById(id);
 const video=$('video'),frame=$('frame'),ctx=frame.getContext('2d',{willReadFrequently:true});
 const KEY='no6_gf_front_history_v4', SIZE=320,HEIGHT=240;
 let stream=null,track=null,raf=0,running=false,session=0,live=null,frames=[],baseline=null,history=[],settings={},locked=false,lastFrameAt=0,lastSettingsAt=0,locking=false;
 const num=x=>Number.isFinite(x)?x.toFixed(2):'—';
 const pct=x=>Number.isFinite(x)?x.toFixed(1)+'%':'—';
 const median=values=>{const a=values.slice().sort((a,b)=>a-b);return a.length?(a.length%2?a[(a.length-1)/2]:(a[a.length/2-1]+a[a.length/2])/2):NaN};
 const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 function loadRecords(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
 function persist(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch{setMessage('기록 저장 공간에 접근할 수 없습니다.','warn')}}
 history=loadRecords();
 function setMessage(msg,type=''){const e=$('message');e.textContent=msg;e.className='message'+(type?' '+type:'')}
 function badge(id,text,kind=''){const e=$(id);e.textContent=text;e.className=(id==='cameraBadge'?'badge':'indicator')+(kind?' '+kind:'')}
 function exposureSnapshot(){const s=track?.getSettings?.()??{};settings=s;locked=s.exposureMode==='manual'&&Number.isFinite(s.exposureTime)&&Number.isFinite(s.iso);badge('exposureState',!running?'노출 확인 전':locked?'노출 고정':'노출 자동 / 미확인',locked?'good':running?'warn':'');$('retry').hidden=!running||locked;return s}
 function captureKey(){const s=settings;return JSON.stringify({mode:s.exposureMode??'?',iso:locked?s.iso:'auto',time:locked?s.exposureTime:'auto',wb:s.whiteBalanceMode??'?',color:s.colorTemperature??'?',device:s.deviceId??''})}
 function validBase(){return Boolean(running&&baseline&&baseline.session===session&&baseline.key===captureKey())}
 function linear(c){const t=c/255;return t<=0.04045?t/12.92:((t+.055)/1.055)**2.4}
 function readFrame(){if(video.readyState<2||!video.videoWidth)return null;
  const vw=video.videoWidth,vh=video.videoHeight,scale=Math.min(SIZE/vw,HEIGHT/vh),w=vw*scale,h=vh*scale;
  ctx.clearRect(0,0,SIZE,HEIGHT);ctx.drawImage(video,(SIZE-w)/2,(HEIGHT-h)/2,w,h);
  const r=29,x0=SIZE/2-r,y0=HEIGHT/2-r,data=ctx.getImageData(x0,y0,r*2,r*2).data;
  let sum=0,sumSq=0,n=0,clip=0,black=0;
  for(let y=0;y<r*2;y+=2)for(let x=0;x<r*2;x+=2){if((x-r)**2+(y-r)**2>r*r)continue;
   const i=(y*r*2+x)*4,R=data[i],G=data[i+1],B=data[i+2];
   const v=(.2126*linear(R)+.7152*linear(G)+.0722*linear(B))*100;
   sum+=v;sumSq+=v*v;n++;if(Math.max(R,G,B)>=250)clip++;if(Math.max(R,G,B)<13)black++;
  }
  if(!n)return null;
  const v=sum/n;return {value:v,clip:clip/n,black:black/n,spatialCV:Math.sqrt(Math.max(0,sumSq/n-v*v))/Math.max(.001,v),at:Date.now()};
 }
 function recent(){return frames.filter(f=>Date.now()-f.at<2400).slice(-14)}
 function measurement(){const a=recent();return median(a.slice(-5).map(f=>f.value))}
 function variation(){const a=recent();if(!a.length)return {n:0,cv:Infinity};const m=a.reduce((s,f)=>s+f.value,0)/a.length;const d=Math.sqrt(a.reduce((s,f)=>s+(f.value-m)**2,0)/a.length);return {n:a.length,cv:m>0?100*d/m:Infinity}}
 function quality(){if(!running||!live)return '대기';if(live.clip>=.012||live.value>=97)return '과다광';if(live.value<.3||live.black>=.35)return '광량 부족';if(live.spatialCV>=.6)return '광원 불균일';const s=variation();if(s.n<9)return '안정화 중';if(s.cv>2.5)return '신호 불안정';return '안정'}
 function update(){const active=validBase(),q=quality(),v=measurement(),s=variation(),comparable=active&&Number.isFinite(v)&&v>=0&&baseline.value>0;const ratio=comparable?v/baseline.value*100:NaN;
  $('live').textContent=running?num(v):'—';$('base').textContent=active?num(baseline.value):'—';$('ratio').textContent=pct(ratio);$('decrease').textContent=pct(100-ratio);$('ratioBar').style.width=comparable?Math.max(0,Math.min(100,ratio))+'%':'0%';
  badge('stabilityState',q==='안정'?'안정 · CV '+s.cv.toFixed(1)+'%':q==='신호 불안정'?'불안정 · CV '+s.cv.toFixed(1)+'%':q,q==='안정'?'good':running?'warn':'');
  $('register').disabled=q!=='안정';$('register').textContent=active?'기준 샘플 재등록':'기준 샘플 등록';
  $('reset').disabled=!baseline;$('save').disabled=!(comparable&&q==='안정');$('sampleBadge').textContent=active?num(baseline.value):baseline?'재등록 필요':'미등록';$('testStatus').textContent=active?'실시간 비교 중':'기준 등록 필요';
  if(!running)return;
  if(!active&&baseline)setMessage('카메라 조건 변경 · 기준 재등록 필요','warn');
  else if(q==='과다광'||q==='광량 부족'||q==='광원 불균일')setMessage(q+' · 광원/시편 위치를 조정하세요.','warn');
  else if(q==='안정'&&!locked)setMessage(active?'실시간 비교 중 · 노출 고정 미지원':'신호 안정 · 노출 고정 미지원','warn');
  else if(q==='안정')setMessage(active?'테스트품 실시간 측정 중':'신호 안정 · 기준 샘플을 등록하세요.');
  else setMessage(q+' · 잠시 고정해 주세요.','warn');
 }
 function stop(){session++;running=false;locking=false;if(raf)cancelAnimationFrame(raf);raf=0;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;track=null;video.srcObject=null;live=null;frames=[];baseline=null;settings={};locked=false;$('preview').classList.remove('live');$('start').disabled=false;$('start').hidden=false;$('stop').disabled=true;$('stop').hidden=true;$('retry').hidden=true;$('retry').disabled=true;badge('cameraBadge','카메라 OFF');exposureSnapshot();update()}
 async function lockExposure(){if(!running||!track||locking)return;locking=true;const currentTrack=track;try{
  const caps=currentTrack.getCapabilities?.()??{},cur=currentTrack.getSettings?.()??{};
  if(Array.isArray(caps.exposureMode)&&caps.exposureMode.includes('manual')){
   const req={exposureMode:'manual'};
   if(caps.exposureTime&&Number.isFinite(caps.exposureTime.min)&&Number.isFinite(caps.exposureTime.max)){
    const a=caps.exposureTime;req.exposureTime=Math.max(a.min,Math.min(a.max,Number.isFinite(cur.exposureTime)?cur.exposureTime:a.min+(a.max-a.min)*.20));
   }
   if(caps.iso&&Number.isFinite(caps.iso.min)&&Number.isFinite(caps.iso.max)){
    const a=caps.iso;req.iso=Math.max(a.min,Math.min(a.max,Number.isFinite(cur.iso)?cur.iso:a.min));
   }
   try{await currentTrack.applyConstraints({advanced:[req]})}catch{}
  }
  if(Array.isArray(caps.whiteBalanceMode)){
   const mode=caps.whiteBalanceMode.includes('manual')?'manual':caps.whiteBalanceMode.includes('single-shot')?'single-shot':null;
   if(mode){try{await currentTrack.applyConstraints({advanced:[{whiteBalanceMode:mode}]})}catch{}}
  }
  if(currentTrack!==track)return;
  exposureSnapshot();frames=[];baseline=null;setMessage(locked?'카메라 노출 고정 · 기준 샘플을 등록하세요.':'노출 고정 미지원 · 비교값은 참고용입니다.',locked?'':'warn');update();
 }finally{locking=false}}
 async function start(){if(running)return;stop();if(!navigator.mediaDevices?.getUserMedia){setMessage('카메라 접근 불가 · HTTPS에서 실행하세요.','bad');return}
  const token=session;try{
   let media;
   try{media=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'user'},width:{ideal:640},height:{ideal:480},frameRate:{ideal:15,max:30}}})}
   catch(e){if(e.name!=='OverconstrainedError')throw e;media=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}})}
   if(token!==session){media.getTracks().forEach(t=>t.stop());return}
   stream=media;track=media.getVideoTracks()[0];const direction=track.getSettings?.().facingMode;
   if(direction==='environment')throw Error('후면 카메라가 연결되었습니다. 전면 카메라를 사용하세요.');
   video.srcObject=media;await video.play();if(token!==session)return;
   running=true;$('preview').classList.add('live');$('start').disabled=true;$('start').hidden=true;$('stop').disabled=false;$('stop').hidden=false;$('retry').hidden=false;$('retry').disabled=false;badge('cameraBadge','카메라 ON','good');exposureSnapshot();setMessage('신호 안정화 중...');raf=requestAnimationFrame(tick);
   await new Promise(resolve=>setTimeout(resolve,850));if(token===session)await lockExposure();
  }catch(e){stop();setMessage('카메라 시작 실패 · '+(e.name==='NotAllowedError'?'카메라 권한을 허용하세요.':e.message),'bad')}
 }
 function tick(now){if(!running)return;raf=requestAnimationFrame(tick);if(now-lastFrameAt<155)return;lastFrameAt=now;
  try{const x=readFrame();if(!x)return;live=x;frames.push(x);if(frames.length>25)frames.shift();if(now-lastSettingsAt>1800){lastSettingsAt=now;exposureSnapshot()}
   update();
  }catch(err){setMessage('영상 측정 오류 · '+err.message,'bad')}
 }
 function register(){if(quality()!=='안정')return;const s=recent();const value=median(s.map(f=>f.value));if(!(value>0))return;
  baseline={value,session,key:captureKey(),time:Date.now()};frames=[];$('testId').value='';setMessage('기준 샘플 등록 완료');update();
 }
 function reset(){baseline=null;frames=[];$('testId').value='';setMessage('기준 초기화 완료');update()}
 function save(){if(!validBase()||quality()!=='안정')return;const v=median(recent().map(x=>x.value)),ratio=v/baseline.value*100;
  const row={time:new Date().toISOString(),product:$('testId').value.trim()||'테스트 '+String(history.length+1).padStart(3,'0'),base:baseline.value,test:v,ratio,drop:100-ratio,cv:variation().cv,mode:locked?'노출 고정':'노출 미고정'};
  history.unshift(row);history=history.slice(0,300);persist();renderRecords();setMessage(row.product+' 저장 완료');$('testId').value='';
 }
 function renderRecords(){$('count').textContent=history.length+'건';$('records').innerHTML=history.length?history.slice(0,8).map(r=>`<div class="rec"><div class="name">${escapeHtml(r.product)}<span class="detail">${escapeHtml(new Date(r.time).toLocaleString('ko-KR'))}</span></div><div class="ratio">${pct(Number(r.ratio))}</div><div class="drop">${pct(Number(r.drop))} 감소</div></div>`).join(''):'<div class="empty">저장된 측정값이 없습니다.</div>';$('csv').disabled=!history.length;$('erase').disabled=!history.length}
 function csvCell(value){let s=String(value??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
 function exportCsv(){if(!history.length)return;const keys=['time','product','base','test','ratio','drop','cv','mode'];const labels=['시간','테스트품','기준 신호','테스트 신호','상대 비율(%)','감소율(%)','안정도 CV(%)','노출 상태'];let rows=[labels.map(csvCell).join(','),...history.map(r=>keys.map(k=>csvCell(r[k])).join(','))];const url=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='NO6_GF_측정기록_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
 $('start').addEventListener('click',start);$('stop').addEventListener('click',()=>{stop();setMessage('카메라를 켜주세요.')});$('retry').addEventListener('click',lockExposure);$('register').addEventListener('click',register);$('reset').addEventListener('click',reset);$('save').addEventListener('click',save);$('csv').addEventListener('click',exportCsv);$('erase').addEventListener('click',()=>{if(!history.length||!confirm('측정 기록을 모두 삭제하시겠습니까?'))return;history=[];persist();renderRecords()});
 window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});
 renderRecords();update();
})();
</script>
</body>
</html>
